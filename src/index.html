<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            /* Pinterest Background */
            background: url('https://i.pinimg.com/736x/4e/ba/ff/4ebaff9d97e5678c8234d074956077fb.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden; /* Prevents whole page scrolling */
        }
        .game-card {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
        }
        h1 {
            color: #ffffff;
            font-size: 26px;
            text-shadow: 2px 3px 5px rgba(0,0,0,0.8);
            margin-bottom: 5px;
        }
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 18px;
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.8);
        }
        .level-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: none;
            padding: 8px 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            flex: 1;
            min-width: 70px;
            text-align: center;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn.active {
            background: #4CAF50;
            color: #fff;
        }
        .pause-btn {
            background: #FFC107;
            color: #000;
        }
        .reload-btn {
            background: #FF5722;
            color: white;
        }
        #gameCanvas {
            border: 3px solid #ffffff;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            width: 100%;
            height: auto;
            max-width: 380px;
            aspect-ratio: 1 / 1;
        }
        
        /* Larger Mobile Controls */
        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            gap: 8px;
            width: 100%;
        }
        .control-row {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .arrow-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #4CAF50;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            color: #2e7d32;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .arrow-btn:active {
            background: #4CAF50;
            color: white;
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Snake Game</h1>

        <div class="stats-bar">
            <span id="score-board">Score: 0</span>
        </div>

        <div class="level-buttons">
            <button class="btn active" onclick="setLevel('easy', this)">Easy</button>
            <button class="btn" onclick="setLevel('medium', this)">Medium</button>
            <button class="btn" onclick="setLevel('hard', this)">Hard</button>
            <button class="btn pause-btn" id="pauseBtn" onclick="togglePause()">Pause ⏸️</button>
            <button class="btn reload-btn" onclick="resetGame()">Reload 🔄</button>
        </div>

        <canvas id="gameCanvas" width="352" height="352"></canvas>

        <!-- Touch Controls for Mobile -->
        <div class="controls-container">
            <div class="control-row">
                <button class="arrow-btn" onclick="handleTouch('ArrowUp')">▲</button>
            </div>
            <div class="control-row">
                <button class="arrow-btn" onclick="handleTouch('ArrowLeft')">◄</button>
                <button class="arrow-btn" onclick="handleTouch('ArrowDown')">▼</button>
                <button class="arrow-btn" onclick="handleTouch('ArrowRight')">►</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Bigger Snake Grid size
        const gridSize = 22;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 8, y: 8 }, { x: 8, y: 9 }];
        let food = { x: 4, y: 4 };
        let dx = 0;
        let dy = -1;
        let score = 0;
        let gameStarted = false;
        let gameOver = false;
        let isPaused = false;
        let speed = 160; 
        let gameLoop = null;

        function setLevel(level, element) {
            document.querySelectorAll('.level-buttons .btn:not(.reload-btn):not(.pause-btn)').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');

            if (level === 'easy') speed = 160;
            if (level === 'medium') speed = 110;
            if (level === 'hard') speed = 70;

            resetGame();
        }

        function togglePause() {
            if (!gameStarted || gameOver) return;
            isPaused = !isPaused;
            const pauseBtn = document.getElementById("pauseBtn");
            if (isPaused) {
                pauseBtn.innerText = "Resume ▶️";
                pauseBtn.style.background = "#4CAF50";
                pauseBtn.style.color = "#fff";
            } else {
                pauseBtn.innerText = "Pause ⏸️";
                pauseBtn.style.background = "#FFC107";
                pauseBtn.style.color = "#000";
            }
        }

        function runGame() {
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(drawGame, speed);
        }

        function drawGame() {
            for (let r = 0; r < tileCount; r++) {
                for (let c = 0; c < tileCount; c++) {
                    ctx.fillStyle = (r + c) % 2 === 0 ? "#e8f5e9" : "#c8e6c9";
                    ctx.fillRect(c * gridSize, r * gridSize, gridSize, gridSize);
                }
            }

            if (!gameStarted) {
                ctx.fillStyle = "#2e7d32";
                ctx.font = "bold 16px Arial";
                ctx.textAlign = "center";
                ctx.fillText("Press Arrow Keys or Buttons!", canvas.width / 2, canvas.height / 2);
                return;
            }

            if (isPaused) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 26px Arial";
                ctx.textAlign = "center";
                ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2);
                return;
            }

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 24px Arial";
                ctx.textAlign = "center";
                ctx.fillText("Game Over!", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "16px Arial";
                ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 20);
                ctx.font = "13px Arial";
                ctx.fillText("Click Reload to Restart", canvas.width / 2, canvas.height / 2 + 45);
                return;
            }

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver = true;
                return;
            }

            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver = true;
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score-board").innerText = "Score: " + score;
                generateFood();
            } else {
                snake.pop();
            }

            // Draw Bigger Apple
            ctx.fillStyle = "#ff3d00";
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#2e7d32";
            ctx.fillRect(food.x * gridSize + gridSize/2 - 1, food.y * gridSize + 2, 3, 5);

            // Draw Bigger Snake Body
            for (let i = 0; i < snake.length; i++) {
                const x = snake[i].x * gridSize + gridSize / 2;
                const y = snake[i].y * gridSize + gridSize / 2;

                ctx.fillStyle = i === 0 ? "#2e7d32" : "#66bb6a";
                ctx.beginPath();
                ctx.arc(x, y, gridSize / 2 - 1, 0, Math.PI * 2);
                ctx.fill();

                if (i === 0) {
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(x - 4, y - 4, 3, 0, Math.PI * 2);
                    ctx.arc(x + 4, y - 4, 3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#000000";
                    ctx.beginPath();
                    ctx.arc(x - 4, y - 4, 1.5, 0, Math.PI * 2);
                    ctx.arc(x + 4, y - 4, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }

        function resetGame() {
            snake = [{ x: 8, y: 8 }, { x: 8, y: 9 }];
            dx = 0;
            dy = -1;
            score = 0;
            gameStarted = false;
            gameOver = false;
            isPaused = false;
            const pauseBtn = document.getElementById("pauseBtn");
            pauseBtn.innerText = "Pause ⏸️";
            pauseBtn.style.background = "#FFC107";
            pauseBtn.style.color = "#000";
            document.getElementById("score-board").innerText = "Score: 0";
            generateFood();
            runGame();
        }

        function changeDirection(key) {
            if (gameOver) {
                resetGame();
                return;
            }
            if (isPaused) return;

            switch (key) {
                case "ArrowUp":
                    if (dy !== 1) { dx = 0; dy = -1; gameStarted = true; }
                    break;
                case "ArrowDown":
                    if (dy !== -1) { dx = 0; dy = 1; gameStarted = true; }
                    break;
                case "ArrowLeft":
                    if (dx !== 1) { dx = -1; dy = 0; gameStarted = true; }
                    break;
                case "ArrowRight":
                    if (dx !== -1) { dx = 1; dy = 0; gameStarted = true; }
                    break;
            }
        }

        function handleTouch(key) {
            changeDirection(key);
        }

        window.addEventListener("keydown", e => {
            // Prevent desktop page scroll when pressing arrow keys
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
                e.preventDefault();
            }

            if (e.key === " ") {
                togglePause();
                return;
            }

            changeDirection(e.key);
        });

        generateFood();
        runGame();
    </script>
</body>
</html>
