<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* Background image setup from provided landscape */
            background: url('https://i.ibb.co/3ykG8Lw/river-landscape.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Fredoka One', 'Segoe UI', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .game-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 4px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ffffff;
            font-size: 36px;
            text-shadow: 2px 3px 5px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
            font-size: 20px;
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.6);
        }
        .level-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn {
            background: #ffffff;
            color: #333;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0,0,0,0.3);
        }
        .btn.active {
            background: #4CAF50;
            color: #fff;
        }
        .reload-btn {
            background: #FF5722;
            color: white;
        }
        #gameCanvas {
            border: 4px solid #ffffff;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
        }
        .hint {
            margin-top: 10px;
            color: #ffffff;
            font-size: 14px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Snake Game</h1>

        <div class="stats-bar">
            <span id="score-board">Score: 0</span>
        </div>

        <div class="level-buttons">
            <button class="btn active" onclick="setLevel('easy', this)">Easy</button>
            <button class="btn" onclick="setLevel('medium', this)">Medium</button>
            <button class="btn" onclick="setLevel('hard', this)">Hard</button>
            <button class="btn reload-btn" onclick="resetGame()">Reload 🔄</button>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="hint">Use Arrow Keys (Up, Down, Left, Right) to play</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }];
        let food = { x: 5, y: 5 };
        let dx = 0;
        let dy = -1;
        let score = 0;
        let gameStarted = false;
        let gameOver = false;
        let speed = 150; // default easy speed
        let gameLoop = null;

        function setLevel(level, element) {
            document.querySelectorAll('.level-buttons .btn:not(.reload-btn)').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');

            if (level === 'easy') speed = 150;
            if (level === 'medium') speed = 100;
            if (level === 'hard') speed = 60;

            resetGame();
        }

        function runGame() {
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(drawGame, speed);
        }

        function drawGame() {
            // Draw background grid pattern
            for (let r = 0; r < tileCount; r++) {
                for (let c = 0; c < tileCount; c++) {
                    ctx.fillStyle = (r + c) % 2 === 0 ? "#e8f5e9" : "#c8e6c9";
                    ctx.fillRect(c * gridSize, r * gridSize, gridSize, gridSize);
                }
            }

            if (!gameStarted) {
                ctx.fillStyle = "#2e7d32";
                ctx.font = "bold 18px Arial";
                ctx.textAlign = "center";
                ctx.fillText("Press Arrow Key to Start!", canvas.width / 2, canvas.height / 2);
                return;
            }

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 28px Arial";
                ctx.textAlign = "center";
                ctx.fillText("Game Over!", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "18px Arial";
                ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 25);
                ctx.font = "14px Arial";
                ctx.fillText("Click Reload or Press Key to Restart", canvas.width / 2, canvas.height / 2 + 55);
                return;
            }

            // Move Snake
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver = true;
                return;
            }

            // Self Collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver = true;
                    return;
                }
            }

            snake.unshift(head);

            // Eat Food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score-board").innerText = "Score: " + score;
                generateFood();
            } else {
                snake.pop();
            }

            // Draw Cute Apple Food
            ctx.fillStyle = "#ff3d00";
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            // Leaf
            ctx.fillStyle = "#2e7d32";
            ctx.fillRect(food.x * gridSize + gridSize/2 - 1, food.y * gridSize + 2, 3, 4);

            // Draw Cute Caterpillar Snake Body
            for (let i = 0; i < snake.length; i++) {
                const x = snake[i].x * gridSize + gridSize / 2;
                const y = snake[i].y * gridSize + gridSize / 2;

                ctx.fillStyle = i === 0 ? "#4caf50" : "#81c784";
                ctx.beginPath();
                ctx.arc(x, y, gridSize / 2 - 1, 0, Math.PI * 2);
                ctx.fill();

                // Eyes on Head
                if (i === 0) {
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(x - 4, y - 4, 3, 0, Math.PI * 2);
                    ctx.arc(x + 4, y - 4, 3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#000000";
                    ctx.beginPath();
                    ctx.arc(x - 4, y - 4, 1.5, 0, Math.PI * 2);
                    ctx.arc(x + 4, y - 4, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }];
            dx = 0;
            dy = -1;
            score = 0;
            gameStarted = false;
            gameOver = false;
            document.getElementById("score-board").innerText = "Score: 0";
            generateFood();
            runGame();
        }

        window.addEventListener("keydown", e => {
            if (gameOver) {
                resetGame();
                return;
            }
            switch (e.key) {
                case "ArrowUp":
                    if (dy !== 1) { dx = 0; dy = -1; gameStarted = true; }
                    break;
                case "ArrowDown":
                    if (dy !== -1) { dx = 0; dy = 1; gameStarted = true; }
                    break;
                case "ArrowLeft":
                    if (dx !== 1) { dx = -1; dy = 0; gameStarted = true; }
                    break;
                case "ArrowRight":
                    if (dx !== -1) { dx = 1; dy = 0; gameStarted = true; }
                    break;
            }
        });

        generateFood();
        runGame();
    </script>
</body>
</html>
